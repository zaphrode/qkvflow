# Standard Transformer - GPT-2 Small Configuration

model:
  type: "standard"
  
  # Architecture (GPT-2 small dimensions)
  hidden_dim: 768
  num_heads: 12
  head_dim: 64  # 768 / 12
  num_layers: 12
  vocab_size: 50257  # GPT-2 tokenizer
  
  # Context
  seq_length: 1024  # GPT-2 standard context
  
  # Standard components
  mlp_ratio: 4  # MLP hidden = 4 * hidden_dim = 3072
  dropout: 0.1
  attn_dropout: 0.1
  activation: "gelu"
  use_bias: true
  
  # Regularization
  weight_decay: 0.1
  gradient_clip: 1.0

training:
  # Batch configuration
  batch_size: 8  # Sequences per batch
  seq_length: 1024  # Tokens per sequence
  gradient_accumulation_steps: 4  # Effective batch = 32 sequences = 32K tokens
  
  # Optimization
  learning_rate: 3.0e-4
  warmup_steps: 2000
  max_steps: 100000  # ~800M tokens
  lr_schedule: "cosine"  # Cosine decay after warmup
  min_lr_ratio: 0.1  # Min LR = 0.1 * max LR
  
  # Precision
  dtype: "bfloat16"  # Mixed precision training
  
  # Gradient
  max_grad_norm: 1.0
  
  # Evaluation
  eval_every: 1000
  eval_steps: 100
  
  # Checkpointing
  save_every: 5000
  keep_checkpoints: 3  # Keep best 3 by validation loss
  
  # Monitoring
  log_every: 100
  use_wandb: true
  wandb_project: "qkvflow-gpt2-small"
  wandb_entity: null  # Set to your wandb username

data:
  dataset: "openwebtext"
  cache_dir: "./data/openwebtext_cache"
  tokenizer: "gpt2"
  
  # Streaming
  streaming: true
  num_workers: 4
  
  # Validation
  val_split: 0.01  # 1% for validation

compute:
  # GPU
  device: "cuda:0"
  num_gpus: 1
  
  # Memory optimization
  gradient_checkpointing: false  # Enable if OOM
  activation_checkpointing: false
  
  # Compilation
  use_jit: true

# Expected metrics
expected:
  # Parameters
  total_params: 117000000  # ~117M
  trainable_params: 117000000
  
  # Training
  steps_per_epoch: ~10000  # Approximate
  total_epochs: 10
  
  # Performance (GPT-2 small benchmarks)
  expected_ppl: 30-35  # WikiText-103
  expected_arc_challenge: 25.0
  expected_arc_easy: 45.0
  expected_hellaswag: 30.0
  expected_mmlu: 25.0
  expected_piqa: 65.0





