baseline:
  expected_ppl: 30-35
  name: standard_gpt2_small
  params: 117000000
compute:
  activation_checkpointing: false
  device: cuda:0
  gradient_checkpointing: false
  num_gpus: 1
  use_jit: true
data:
  cache_dir: ./data/openwebtext_cache
  dataset: openwebtext
  num_workers: 4
  streaming: true
  tokenizer: gpt2
  val_split: 0.01
expected:
  steps_per_epoch: ~10000
  target_benchmark_ratio: 0.85
  target_ppl_ratio: 1.1
  total_epochs: 10
  total_params: 270000
  trainable_params: 270000
model:
  activation: gelu
  attn_dropout: 0.1
  dropout: 0.1
  gradient_clip: 1.0
  head_dim: 64
  hidden_dim: 768
  mlp_ratio: 4
  num_heads: 12
  num_layers: 12
  seq_length: 1024
  sinusoidal_dim: 128
  tembed_dim: 256
  type: time_indexed_mlp
  use_bias: true
  use_time_indexed_attention: true
  use_time_indexed_mlp: true
  vocab_size: 50257
  weight_decay: 0.1
training:
  batch_size: 8
  dtype: bfloat16
  eval_every: 1000
  eval_steps: 100
  gradient_accumulation_steps: 4
  keep_checkpoints: 3
  learning_rate: 0.0003
  log_every: 100
  lr_schedule: cosine
  max_grad_norm: 1.0
  max_steps: 100000
  min_lr_ratio: 0.1
  save_every: 5000
  seq_length: 1024
  use_wandb: true
  wandb_entity: null
  wandb_project: qkvflow-gpt2-small
  warmup_steps: 2000
